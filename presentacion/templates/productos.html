<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos</title>
    <style>
      :root {
        --bg-1: #f3f7ff;
        --bg-2: #eef9f3;
        --card: rgba(255,255,255,0.85);
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --secondary: #0f766e;
        --muted: #64748b;
        --border: #dfe7f3;
        --text: #1f2937;
        --danger: #dc2626;
      }

      * { box-sizing: border-box; }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        margin: 0;
        padding: 40px 20px;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 18px 45px rgba(79, 70, 229, 0.12);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.5rem);
        color: #111827;
      }

      .subtitulo {
        color: var(--muted);
        margin-bottom: 18px;
        font-size: 0.98rem;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 16px;
        border: 1px solid var(--border);
      }

      th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      th {
        background: linear-gradient(135deg, #eef2ff, #ecfeff);
        color: #1e293b;
        font-weight: 700;
      }

      tbody tr:hover {
        background: rgba(79, 70, 229, 0.03);
      }

      td:last-child {
        width: 140px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        border: 0;
        border-radius: 10px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn.secondary {
        background: linear-gradient(135deg, var(--secondary), #115e59);
        box-shadow: 0 8px 18px rgba(15, 118, 110, 0.22);
      }

      .btn.danger {
        background: linear-gradient(135deg, #ef4444, var(--danger));
      }

      .error {
        color: var(--danger);
        font-size: 0.82rem;
        margin-top: 6px;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      input, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        font-size: 0.96rem;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus, textarea:focus {
        border-color: rgba(79, 70, 229, 0.7);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        outline: none;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
        <div>
          <h1>Productos</h1>
          <div class="subtitulo">Gestión rápida y visual de inventario</div>
        </div>
        <a class="btn" href="/productos/nuevo" style="margin-left:auto;">Añadir producto</a>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for producto in productos %}
            {% include 'componentes/fila_producto.html' %}
          {% endfor %}
          {% if productos|length == 0 %}
            <tr>
              <td colspan="6">No hay productos registrados.</td>
            </tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </body>
</html>
