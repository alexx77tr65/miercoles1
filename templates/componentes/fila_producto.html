<tr>
  <td>{{ producto.id }}</td>
  <td>{{ producto.nombre }}</td>
  <td>{{ producto.precio }}</td>
  <td>{{ producto.cantidad }}</td>
  <td>{{ producto.descripcion or '' }}</td>
  <td>
    <div class="actions">
      <a class="btn secondary" href="/productos/{{ producto.id }}/editar">Editar</a>
      <form method="post" action="/productos/{{ producto.id }}/eliminar" style="display:inline; margin:0;">
        <button class="btn danger" type="submit" onclick="return confirm('¿Seguro que quieres borrar este producto?');">Borrar</button>
      </form>
    </div>
  </td>
</tr>
